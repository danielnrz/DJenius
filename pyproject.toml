[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "djenius"
version = "0.1.0"
description = "A fully local personal smart DJ application"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6.0",
]
all = [
    "PySide6>=6.6.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
djenius = "djenius.cli:app"

[tool.setuptools.packages.find]
include = ["djenius*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require real audio files",
]
